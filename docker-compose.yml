services:
  streamer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube_live_streamer
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - YOUTUBE_ENABLED=${YOUTUBE_ENABLED:-true}
      - YOUTUBE_RTMP_URL=${YOUTUBE_RTMP_URL:-rtmp://a.rtmp.youtube.com/live2}
      - YOUTUBE_STREAM_KEY=${YOUTUBE_STREAM_KEY:-}
      - KICK_ENABLED=${KICK_ENABLED:-true}
      - KICK_RTMP_URL=${KICK_RTMP_URL:-rtmps://fa723fc1b171.global-contribute.live-video.net/app}
      - KICK_STREAM_KEY=${KICK_STREAM_KEY:-}
      - NIMO_ENABLED=${NIMO_ENABLED:-false}
      - NIMO_RTMP_URL=${NIMO_RTMP_URL:-rtmp://alpush.rtmp.nimo.tv/live/}
      - NIMO_STREAM_KEY=${NIMO_STREAM_KEY:-}
      - VIDEO_SOURCE=${VIDEO_SOURCE:-video.mp4}
      - VIDEO_LOOP=true
      - AUTO_START=${AUTO_START:-false}
      - RECONNECT_ENABLED=true
    volumes:
      - ./videos:/app/videos
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
